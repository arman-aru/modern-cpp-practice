name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: Compile (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Compile every exercise
        run: |
          status=0
          for file in $(git ls-files '*.cpp'); do
            if ${{ matrix.compiler }} -std=c++17 -Wall -Werror -o /tmp/exercise "$file"; then
              echo "ok    $file"
            else
              echo "FAIL  $file"
              status=1
            fi
          done
          exit $status
